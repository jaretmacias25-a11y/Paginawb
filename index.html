<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Encabezado */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }

        /* Contenido principal */
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .card {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Botón interactivo */
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Pie de página */
        footer {
            background-color: #ecf0f1;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <header>
        <h1>¡Bienvenido a mi casa¡¡¡</h1>
        <p>Una página sencilla hecha con HTML, CSS y JavaScript.</p>
    </header>

    <main>
        <section class="card">
            <h2>Hola, mundo 👋</h2>
            <p>Esta es una plantilla básica que puedes personalizar a tu gusto. Haz clic en el botón para ver JavaScript en acción.</p>
            <button onclick="saludar()">¡Haz clic aquí!</button>
            <p id="mensaje" style="margin-top: 1.5rem; font-weight: bold; color: #27ae60;"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>

    <script>
        function saludar() {
            document.getElementById('mensaje').textContent = '¡Gracias por hacer clic! Tu página está funcionando perfectamente.';
        }
    </script>

</body>
</html>
